.ppdef{display:flex;flex-direction:column;gap:8px}.ppdefh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.ppkgrid2 h3{margin:0 0 6px;font-size:15px}

.ppsep{width:1px;background:var(--line);margin:0 4px}
.ppchart .ppch,.ppcalh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.ppchart h3,.ppk h3{margin:0;font-size:15px}
.pptiles{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.pptile{flex:1 1 180px;min-width:0;border:1px solid var(--line);border-left:3px solid var(--bc,var(--accent));border-radius:10px;padding:8px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;background:var(--surface-2)}
.pptile .tt{grid-column:1/-1;font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.pptile .tt i{width:9px;height:9px;border-radius:2px;background:var(--bc,var(--accent));flex:none}
.pptile b{font-family:var(--mono);font-size:16px;font-weight:600}
.pptile .tr{font-family:var(--mono);font-size:13px;color:var(--ink-2);align-self:end}
.ppnote{font-size:12px;color:var(--muted);margin:8px 0 0}
.ppkgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,2fr);gap:14px}
@media (max-width:900px){.ppkgrid{grid-template-columns:minmax(0,1fr)}}
.tscroll{overflow-x:auto}
.pptab{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.pptab th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:7px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.pptab td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.pptab .num{text-align:right;font-family:var(--mono)}
.pptab th:nth-child(2),.pptab td:nth-child(2){text-align:right}
.pptab td.up{color:var(--up);font-weight:600}.pptab td.down{color:var(--down);font-weight:600}
.pptab tr.next td{background:var(--accent-wash)}
.pptab a{color:var(--accent);text-decoration:none}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:4px;background:var(--accent);color:#fff;vertical-align:1px}
.ppsum{font-size:13px;color:var(--ink-2);margin:8px 0}
.ppcl{list-style:none;margin:0;padding:0;cursor:pointer}
.ppcl li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:2px 8px;padding:7px 4px;border-bottom:1px solid var(--line)}
.ppcl li:last-child{border-bottom:0}
.ppcl .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--axis)}
.ppcl li.past .dot{background:var(--up)}.ppcl li.today .dot{background:var(--accent)}
.ppcl .dd{font-size:13px;color:var(--ink)}
.ppcl .kk{grid-column:2;font-size:12px;font-family:var(--mono);color:var(--ink-2)}
.ppcl li.future .dd{color:var(--muted)}

<style>
/* Düzen: üst başlık + kaynak sekmeleri (BDDK / TCMB / Tüm); her sekmede kontrol çubuğu, altında kartlar. */
:root{
  color-scheme:light;
  --page:#f4f5f7; --surface:#ffffff; --surface-2:#f8f8f6; --ink:#1a1d26; --ink-2:#4f4e4a; --muted:#85837d;
  --grid:#e7e6e0; --axis:#c3c2b7; --line:rgba(11,11,11,.10); --accent:#c8102e; --accent-wash:#fdecee;
  --up:#0b7a0b; --down:#c62828; --up-bar:#2e9b4f; --down-bar:#d9534f;
  --g-sektor:#2a78d6; --g-katilim:#eb6834; --g-kamu:#1baf7a; --g-ozel:#eda100; --g-yabanci:#e87ba4; --g-mevduat:#008300; --g-kalkinma:#6250d6;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
  --mono:"DM Mono","SF Mono",ui-monospace,Menlo,monospace; --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --page:#0f1012; --surface:#1a1a19; --surface-2:#222220; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#8f8d86;
  --grid:#2c2c2a; --axis:#3d3d3a; --line:rgba(255,255,255,.10); --accent:#f0525f; --accent-wash:#3a171b;
  --up:#3fbf3f; --down:#ef6b6b; --up-bar:#3aa95c; --down-bar:#e06565;
  --g-sektor:#3987e5; --g-katilim:#d95926; --g-kamu:#199e70; --g-ozel:#c98500; --g-yabanci:#d55181; --g-mevduat:#1f9a1f; --g-kalkinma:#9085e9;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#1f9a1f; --c7:#9085e9; --c8:#e66767;}}
:root[data-theme="dark"]{
  color-scheme:dark; --page:#0f1012; --surface:#1a1a19; --surface-2:#222220; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#8f8d86;
  --grid:#2c2c2a; --axis:#3d3d3a; --line:rgba(255,255,255,.10); --accent:#f0525f; --accent-wash:#3a171b;
  --up:#3fbf3f; --down:#ef6b6b; --up-bar:#3aa95c; --down-bar:#e06565;
  --g-sektor:#3987e5; --g-katilim:#d95926; --g-kamu:#199e70; --g-ozel:#c98500; --g-yabanci:#d55181; --g-mevduat:#1f9a1f; --g-kalkinma:#9085e9;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#1f9a1f; --c7:#9085e9; --c8:#e66767;}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding-inline:16px}
header.top{background:transparent}
.top .wrap{padding-block:20px 0}
.brandtitle{margin:0;font-family:Archivo,var(--sans);font-size:26px;font-weight:800;letter-spacing:.03em;line-height:1.15;text-transform:uppercase;text-wrap:balance;border-bottom:2px solid var(--ink);padding-bottom:10px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink-2)}
.pill b{font-family:var(--mono);color:var(--ink);font-weight:500}
.iconbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:12px}
nav.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:700px){nav.tabs{gap:8px}}
nav.tabs button{font-family:Archivo,var(--sans);font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;text-align:center;padding:13px 10px;border:1px solid var(--line);border-bottom:3px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);cursor:pointer}
nav.tabs button small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-wash)}
main.wrap{padding-block:16px 48px}
.note{font-size:13px;color:var(--muted)}
.notice{display:block;line-height:1.5;margin-bottom:14px}
.bar{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.bar .lbl,.ppdefh .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-wash);color:var(--ink);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:9px 16px;cursor:pointer;font-weight:600;color:var(--ink-2);font-size:14.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;max-width:100%;font-size:14.5px}
input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;width:100%}
.period{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.period .arrow{color:var(--muted)}
.period .span{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.card h3{margin:0;font-size:16px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2)}
.card .sub{font-size:13px;color:var(--muted)}
.stack{display:grid;gap:12px}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.headline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.headline .big{font:700 30px/1.15 var(--mono);letter-spacing:-.02em}
.headline .pc{font:500 16px var(--mono)}
.headline .lvl{font-size:14px;color:var(--muted)}
.headline .lvl b{font-family:var(--mono);font-weight:500;color:var(--ink-2)}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.up{color:var(--up)} .down{color:var(--down)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface-2);font-weight:700;color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;z-index:1}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;font-family:var(--sans);white-space:normal;min-width:220px}
th.chk,td.chk{min-width:0!important;width:1%;padding-left:10px!important;padding-right:0!important}
td.chk input{margin:0;vertical-align:middle}
th.chk+th{text-align:left}
td.chk+td{padding-left:8px}
tr.l2 td.chk+td.nm{padding-left:22px}
tr.l3 td.chk+td.nm{padding-left:34px}
td.chk+td{text-align:left;font-family:var(--sans);white-space:normal;min-width:220px}
tr.l0 td.nm{font-weight:700}
tr.l2 td.nm{padding-left:26px;color:var(--ink-2)}
tr.l3 td.nm{padding-left:40px;color:var(--ink-2)}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--accent-wash)}
tbody tr.sel{background:var(--accent-wash)}
tr.detail td{background:var(--surface-2);cursor:default;white-space:normal}
td.na{color:var(--muted)}
td .sm{color:var(--muted);font-size:11px;margin-left:6px}
td .sm.up{color:var(--up)} td .sm.down{color:var(--down)}
.cgrid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:20px;align-items:start}
@media (max-width:1000px){.cgrid{grid-template-columns:minmax(0,1fr)}}
.chartbox{position:sticky;top:8px;min-width:0}
.lt td.chk input{cursor:pointer}
.lt td.barc{white-space:nowrap;min-width:190px}
.lt th.barh{text-align:center}
.mb{position:relative;display:inline-block;width:120px;height:14px;vertical-align:middle;margin-right:8px}
.mb::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--axis)}
.mb i{position:absolute;top:1px;height:12px;border-radius:3px}
.lt .v{display:inline-block;min-width:96px;text-align:right}
.dd{position:relative}
.dd summary{list-style:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 32px 8px 12px;font-size:14.5px;min-width:280px;max-width:min(520px,80vw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.dd summary::-webkit-details-marker{display:none}
.dd summary::after{content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.ddpanel{position:absolute;z-index:20;top:calc(100% + 4px);left:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;min-width:280px;max-width:90vw;max-height:60vh;overflow:auto}
.ddpanel label{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap}
.ddpanel label:hover{background:var(--accent-wash)}
.ddpanel label.grp{font-weight:600}
.ddpanel label.sub{padding-left:30px;color:var(--ink-2)}
.ddpanel hr{border:0;border-top:1px solid var(--grid);margin:4px 0}
.nmw{display:flex;align-items:baseline}
.nmw .caret,.nmw .caret-sp{flex:none}
.caret{border:0;background:none;cursor:pointer;color:var(--ink-2);width:18px;padding:0;margin-right:4px;font-size:12px;line-height:1}
.caret:hover{color:var(--accent)}
.caret-sp{display:inline-block;width:22px}
.lt td.nm .b{font-weight:700}
.lt td.nm .syn{font-style:normal}
.lt tr.root td{border-bottom-color:var(--axis)}
.treetools{display:flex;gap:14px}
.more{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;padding:8px 0 0}
/* yatay değişim çubukları */
.dbars{display:grid;gap:4px}
.dbar{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px}
.dbar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.dbar .t{position:relative;height:16px}
.dbar .t::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--axis)}
.dbar .t i{position:absolute;top:2px;height:12px;border-radius:3px}
.dbar .v{font-family:var(--mono);text-align:right;min-width:86px}
/* grafik */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.14);min-width:170px;max-width:320px;opacity:0;transition:opacity .08s;z-index:5}
.chart .tip .d{color:var(--muted);margin-bottom:4px}
.chart .tip .r{display:flex;align-items:center;gap:8px;justify-content:space-between}
.chart .tip .r span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart .tip .r i{width:10px;height:3px;border-radius:2px;display:inline-block;margin-right:4px}
.chart .tip .r b{font-family:var(--mono);font-weight:500}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:6px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.axis text{fill:var(--muted);font:12px var(--mono)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.hidden{display:none!important}
/* TCMB yerleşimi */
.tlayout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.tlayout{grid-template-columns:minmax(0,1fr)}.tnav{position:static;max-height:none}}
.tnav{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
.tsec summary{list-style:none;cursor:pointer;margin:4px 0;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);display:flex;gap:8px;align-items:flex-start}
.tsec summary::-webkit-details-marker{display:none}
.tsec summary::before{content:"▸";color:var(--muted);flex:none}
.tsec[open] summary::before{content:"▾"}
.tsec summary:hover{background:var(--surface-2)}
.tsec label{display:flex;gap:8px;align-items:flex-start;padding:7px 10px 7px 26px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--ink-2)}
.tsec label:hover{background:var(--surface-2)}
.tsec label input{margin-top:3px;flex:none}
.tsec label:has(input:checked){background:var(--accent-wash);color:var(--ink);font-weight:600}
.tsec label.off{opacity:.5}
.tsec label .gen{font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin-left:6px}
.tnav h4{margin:10px 8px 4px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tnav button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--ink-2)}
.tnav button:hover{background:var(--surface-2)}
.tnav button[aria-current="true"]{background:var(--accent-wash);color:var(--ink);font-weight:600}
.tnav button.off{opacity:.45}
.tnav button .gen{font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin-left:6px}
.tnav-select{display:none;margin-bottom:10px;width:100%}
.kv{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.kv b{color:var(--ink-2);font-weight:500;font-family:var(--mono)}
/* Tüm */
.selchips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.selchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 10px;font-size:12px;background:var(--surface-2);max-width:100%;min-width:0}
.selchip i{width:10px;height:10px;border-radius:50%;flex:none}
.selchip > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px;min-width:0}

<script>
(() => {
"use strict";
// =============================================================== yardımcılar
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const NF = {}; const nf = d => NF[d] || (NF[d] = new Intl.NumberFormat("tr-TR", { minimumFractionDigits: d, maximumFractionDigits: d }));

const pct = (a, b) => (!ok(a) || !ok(b) || b === 0) ? null : (a / b - 1) * 100 * (b < 0 ? -1 : 1);
const AY = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];

const dShort = s => { if (isMonth(s)) { const [y, m] = s.split("-"); return `${AY[+m - 1]} ${y.slice(2)}`; } const [y, m, d] = s.split("-"); return `${+d} ${AY[+m - 1]} ${y.slice(2)}`; };
const toDate = s => isMonth(s) ? new Date(+s.slice(0, 4), +s.slice(5, 7), 0) : new Date(s + "T00:00:00");

const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const PAL = () => [1, 2, 3, 4, 5, 6, 7, 8].map(i => cssVar("--c" + i));

// Birim türleri: tl (milyon TL), usd (milyon USD), pct (%), count (adet), idx (endeks/diğer)
function fmtVal(v, kind, signed = false) {
  if (!ok(v)) return "—";
  const s = signed ? sgnOf(v, 2) : (v < 0 ? "−" : ""), a = Math.abs(v);

    const cur = kind === "tl" ? "₺" : "$";
    if (a >= 1e6) return `${s}${nf(2).format(a / 1e6)} trn ${cur}`;
    if (a >= 1e3) return `${s}${nf(1).format(a / 1e3)} mr ${cur}`;
    if (a >= 1) return `${s}${nf(0).format(a)} mn ${cur}`;
    return `${s}${nf(2).format(a)} mn ${cur}`;
  }
  if (kind === "pct") return `${s}${nf(2).format(a)}%`;
  if (kind === "count") { if (a >= 1e9) return `${s}${nf(2).format(a / 1e9)} mr`; if (a >= 1e6) return `${s}${nf(2).format(a / 1e6)} mn`; if (a >= 1e4) return `${s}${nf(1).format(a / 1e3)} bin`; return s + nf(0).format(a); }

}
const fmtFull = (v, kind) => !ok(v) ? "—" : (kind === "pct" || kind === "idx") ? nf(2).format(v) : nf(0).format(v);

// değişim hücreleri: tutar için Δ ve Δ%, oran için bp
function deltaCells(a, b, kind) {
  if (kind === "pct") { const d = ok(a) && ok(b) ? (b - a) * 100 : null; return [`<td class="${cls(d, 0.5)}">${fmtBp(d)}</td>`, `<td class="na">—</td>`]; }
  const d = ok(a) && ok(b) ? b - a : null, p = pct(b, a);

}

// =============================================================== şifre ve veri
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const gunzip = async bytes => JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
async function decrypt(env, password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64(env.salt), iterations: env.iter || 250000 }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

}
const FILES = ["bddk_haftalik", "bddk_aylik", "evds", "politika"];
async function fetchJSON(u) { const r = await fetch(u, { cache: "no-cache" }); if (!r.ok) throw new Error(r.status); return r.json(); }
async function loadAll() {
  const out = {};
  await Promise.all(FILES.map(async f => { try { out[f] = await fetchJSON(`data/${f}.json`); } catch { out[f] = null; } }));
  return out;
}

// =============================================================== durum
const S = {
  tab: "bddk",
  bFreq: store.get("bv.freq") || "w", bA: null, bB: null, bGroups: (store.get("bv.groups") || "katilim").split(","), bCur: store.get("bv.cur") || "Toplam", bTables: {},
  bColOverride: {}, bChk: {}, bIdx: {}, bOpenN: new Set(),
  tSub: "pp", tTopics: {}, tAB: {}, tClosed: new Set(), tBank: store.get("bv.tbank") || "katilim", tA: null, tB: null, tSel: {}, tRange: "2Y",
  aSel: [], aIndex: false, aRange: "2Y", aSrc: "all",
};
let D = null;
const GROUPS = [
  { key: "sektor", name: "Sektör" }, { key: "katilim", name: "Katılım" }, { key: "kamu", name: "Kamu" }, { key: "ozel", name: "Yerli Özel" },
  { key: "yabanci", name: "Yabancı" }, { key: "mevduat", name: "Mevduat" }, { key: "kalkinma", name: "Kalkınma ve Yatırım" }];
S.bGroups = S.bGroups.filter(g => GROUPS.some(x => x.key === g)); if (!S.bGroups.length) S.bGroups = ["katilim"];
const gName = k => (GROUPS.find(g => g.key === k) || {}).name || k;
const gColor = k => cssVar("--g-" + k);

// --------------------------------------------------------------- BDDK modeli (haftalık / aylık ortak arayüz)
function rowKind(tableNo, name, colName, freq) {
  const n = name + " " + (colName || "");
  if (/Sayısı|Adet/i.test(n) || (freq === "m" && tableNo === 16)) return "count";
  if (/\(%\)|Rasyo/i.test(n) || (freq === "m" && (tableNo === 15 || tableNo === 17))) return /\((Gün|Bin TL|Kişi)\)/i.test(name) ? "idx" : "pct";
  return "tl";
}
function modelWeekly(raw) {
  if (!raw || !raw.values) return null;
  const ids = Object.keys(raw.values).sort((a, b) => a - b);
  const dates = ids.map(i => raw.weeks[i]);
  const tables = raw.tables.map(t => ({
    key: t.key, name: t.name, cols: t.cols && t.cols.length ? t.cols : ["TOPLAM"], scale: 1,
    rows: t.rows.map(r => ({ id: String(r.id), name: r.name, lvl: r.lvl ?? 1 })),
  }));
  const get = (g, tk, rid, c, i) => { const v = raw.values[ids[i]]?.[g]?.[tk]?.[rid]; return v && ok(v[c]) ? v[c] : null; };
  return { freq: "w", raw, dates, tables, get, unitNote: "Milyon TL" };
}
function modelMonthly(raw) {
  if (!raw || !raw.values) return null;
  const dates = Object.keys(raw.values).sort();
  const tables = raw.tables.map(t => ({
    key: String(t.no), no: t.no, name: t.name, cols: t.cols || [], scale: t.no === 5 ? 1 / 1000 : 1, // Sektörel kredi dağılımı bin TL yayımlanır
    rows: t.rows.filter(r => r.name).map(r => ({ id: String(r.no), name: String(r.name).replace(/\*+$/, "").trim(), lvl: /bold/i.test(r.style || "") ? 0 : (/italic/i.test(r.style || "") || /^\s*[a-zçğıöşü]\)/i.test(r.name)) ? 2 : 1 })),
  }));
  const tmap = Object.fromEntries(tables.map(t => [t.key, t]));
  const get = (g, tk, rid, c, i) => { const v = raw.values[dates[i]]?.[g]?.[tk]?.[rid]; if (!v || !ok(v[c])) return null; const k = rowKind(+tk, "", tmap[tk]?.cols[c], "m"); return k === "count" ? v[c] : v[c] * (tmap[tk]?.scale || 1); };
  return { freq: "m", raw, dates, tables, get, unitNote: "Milyon TL (rasyolar %)" };
}
function prepEvds(raw) {
  if (!raw || !raw.groups) return null;
  const kindOf = g => { const u = trLower(g.unit || ""); if (/bin tl/.test(u)) return "tl"; if (/abd/.test(u)) return "usd"; if (/ağırlıklı|yüzde/.test(u)) return "pct"; if (/işlem/.test(u)) return "count"; return "idx"; };
  for (const g of Object.values(raw.groups)) {
    g.kind = kindOf(g); g.scale = /bin tl/.test(trLower(g.unit || "")) ? 1 / 1000 : 1; g.weekly = /HAFTA/.test(g.freq || "");
    g.flow = !!g.akim; // haftalık değişim (akım) serisi: dönem karşılaştırması yerine dönem toplamı
    g.idx = Object.fromEntries((g.series || []).map(s => [s.code, s]));
  }
  return raw;
}
// EVDS seri adındaki numaralandırmadan girinti düzeyi (1. / 1.1. / 1.1.2.a.)
const evdsLvl = name => { const m = /^\s*(\d+(?:\.\d+)*)\.?\s*([a-zçğıöşü]{1,3}\.)?/i.exec(name); if (!m) return 1; const depth = m[1].split(".").length + (m[2] ? 1 : 0); return Math.min(3, depth - 1); };

// =============================================================== grafik (tek eksen, SVG)
function lineChart(el, { series, height = 340, yFmt, gapDays = 0 }) {
  el.innerHTML = "";
  series = series.filter(s => s.data.some(p => ok(p[1])));
  if (!series.length) { el.innerHTML = '<div class="empty">Seçili dönemde veri yok.</div>'; return; }
  if (series.length > 1) {
    const lg = document.createElement("div"); lg.className = "legend";
    lg.innerHTML = series.map(s => `<span><i style="${s.dash ? `background:none;border-top:2px ${s.dash === "2 3" ? "dotted" : "dashed"} ${s.color};height:0` : `background:${s.color}`}"></i>${esc(s.name)}${s.dash === true ? " (kesikli)" : ""}</span>`).join("");
    el.appendChild(lg);
  }
  const box = el.appendChild(Object.assign(document.createElement("div"), { className: "chart" }));
  const W = Math.max(320, box.clientWidth || el.clientWidth || 640), H = height, m = { t: 12, r: 16, b: 26, l: 64 };
  const all = series.flatMap(s => s.data.filter(p => ok(p[1])));
  const x0 = Math.min(...all.map(p => p[2])); let x1 = Math.max(...all.map(p => p[2])); if (x1 === x0) x1 = x0 + 864e5;
  let y0 = Math.min(...all.map(p => p[1])), y1 = Math.max(...all.map(p => p[1]));
  if (y0 === y1) { y0 -= Math.abs(y0) * 0.05 || 1; y1 += Math.abs(y1) * 0.05 || 1; }
  const allPos = y0 >= 0;
  const pad = (y1 - y0) * 0.08; y0 -= pad; y1 += pad;
  if (allPos && y0 < 0) y0 = 0; // pozitif seride eksen sıfırın altına inmesin
  const ticks = niceTicks(y0, y1, 5).filter(t => !allPos || t >= 0); y0 = Math.min(y0, ticks[0]); y1 = Math.max(y1, ticks[ticks.length - 1]);
  if (new Set(ticks.map(yFmt)).size < ticks.length && ticks.length > 1) { let d = 0; while (d < 4 && new Set(ticks.map(v => nf(d).format(v))).size < ticks.length) d++; yFmt = v => nf(d).format(v); }
  const X = t => m.l + (t - x0) / (x1 - x0) * (W - m.l - m.r);
  const Y = y => m.t + (1 - (y - y0) / (y1 - y0)) * (H - m.t - m.b);
  const span = x1 - x0;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Zaman serisi grafiği"><g class="axis">`;
  for (const t of ticks) svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)"/><text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end">${yFmt(t)}</text>`;
  const nX = Math.max(2, Math.min(7, Math.floor((W - m.l) / 105)));
  for (let i = 0; i < nX; i++) { const t = x0 + span * i / (nX - 1); const d = new Date(t); const lab = span > 400 * 864e5 ? `${AY[d.getMonth()]} ${String(d.getFullYear()).slice(2)}` : `${d.getDate()} ${AY[d.getMonth()]}`; svg += `<text x="${X(t)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === nX - 1 ? "end" : "middle"}">${lab}</text>`; }
  svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="var(--axis)"/></g>`;
  for (const s of series) {
    let d = "", pen = false, prev = null;
    for (const [, y, t] of s.data) {
      if (!ok(y)) { pen = false; continue; }
      if (pen && gapDays && t - prev > gapDays * 864e5) pen = false;
      d += (pen ? "L" : "M") + X(t).toFixed(1) + " " + Y(y).toFixed(1) + (pen ? "" : "h0.01"); pen = true; prev = t;
    }
    svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ` stroke-dasharray="${s.dash === true ? "6 4" : s.dash}"` : ""}/>`;
    const lp = [...s.data].reverse().find(p => ok(p[1]));
    if (lp) svg += `<circle cx="${X(lp[2])}" cy="${Y(lp[1])}" r="3.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
  }
  svg += `<line class="xh" y1="${m.t}" y2="${H - m.b}" stroke="var(--axis)" stroke-dasharray="3 3" opacity="0"/><g class="dots"></g><rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent"/></svg><div class="tip"></div>`;
  box.innerHTML = svg;
  const svgEl = box.querySelector("svg"), tip = box.querySelector(".tip"), xh = box.querySelector(".xh"), dots = box.querySelector(".dots");
  const near = (s, t) => { let best = null; for (const p of s.data) { if (!ok(p[1])) continue; if (p[2] <= t + 3.5 * 864e5) best = p; else break; } return best && t - best[2] < 40 * 864e5 ? best : null; };
  const move = ev => {
    const r = svgEl.getBoundingClientRect(); const px = (ev.clientX - r.left) * (W / r.width);
    const t = x0 + (px - m.l) / (W - m.l - m.r) * span;
    let rows = "", dd = "", head = null;
    series.forEach(s => { const p = near(s, t); if (!p) return; if (!head || p[2] > head[2]) head = p; rows += `<div class="r"><span><i style="background:${s.color}"></i>${esc(s.name)}</span><b>${yFmt(p[1])}</b></div>`; dd += `<circle cx="${X(p[2])}" cy="${Y(p[1])}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`; });
    if (!head) return;
    const cx = X(head[2]); xh.setAttribute("x1", cx); xh.setAttribute("x2", cx); xh.setAttribute("opacity", 1); dots.innerHTML = dd;
    tip.innerHTML = `<div class="d">${dLabel(head[0])}</div>${rows}`; tip.style.opacity = 1;
    const bw = box.clientWidth, tw = tip.offsetWidth, sx = cx * (r.width / W);
    tip.style.top = "6px"; tip.style.left = (sx + 14 + tw > bw ? Math.max(0, sx - tw - 14) : sx + 14) + "px";
  };
  svgEl.addEventListener("pointermove", move);
  svgEl.addEventListener("pointerleave", () => { tip.style.opacity = 0; xh.setAttribute("opacity", 0); dots.innerHTML = ""; });
}
function niceTicks(a, b, n) {
  const span = b - a || 1, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(s => s >= step0) || 10 * mag;

  const table = `<article class="card ppk"><h3>${yrs.length > 1 ? `${yrs[0]}–${yrs[yrs.length - 1]}` : yrs[0] || ""} TCMB Politika Faizi Süreci</h3>
    <div class="tscroll"><table class="pptab"><thead><tr><th>PPK Tarihi</th><th>Karar</th><th class="num">Pol. Faizi</th><th class="num">TÜFE Yıllık</th><th class="num">Reel Faiz</th></tr></thead><tbody>`
    + win.map(x => `<tr class="${x.yayin ? "" : "next"}"><td>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${dShort(x.tarih)}</a>` : dShort(x.tarih)}${x.ara ? " *" : ""}${x.yayin ? "" : ' <span class="tag">Sıradaki</span>'}</td>
      <td class="${x.bp > 0 ? "up" : x.bp < 0 ? "down" : ""}">${x.karar || "—"}</td><td class="num">${ppPct(x.faiz, 2)}</td><td class="num">${ppPct(x.tufe, 2)}</td><td class="num ${cls(x.reel, 0.005)}">${ok(x.reel) ? `${sgnOf(x.reel, 1)}${nf(1).format(Math.abs(x.reel))} puan` : "—"}</td></tr>`).join("")
    + `</tbody></table></div><p class="ppnote">TÜFE Yıllık: PPK öncesi son açıklanan aya ait yıllık değişim (EVDS, TÜFE endeksi). Reel faiz = Pol. Faizi − TÜFE Yıllık.${netBp != null ? ` Net ${netBp < 0 ? "indirim" : netBp > 0 ? "artış" : "değişim"}: ${Math.abs(netBp)}bp (%${nf(2).format(before0)}→%${nf(2).format(endR)}).` : ""} Kaynak: TCMB 1 Hafta Repo tarihçesi ve PPK kararları.${win.some(x => x.ara) ? " * Ara toplantı." : ""}</p></article>`;
  const Y = PPS.ppkYear && years.includes(PPS.ppkYear) ? PPS.ppkYear : (years.includes(nowY) ? nowY : years[years.length - 1]);
  const ys = L.filter(x => +x.yil === Y), yp = ys.filter(x => x.yayin && ok(x.faiz)), yb = yp.length ? (m.F.filter(f => f.tarih <= yp[0].tarih).pop() || {}).oran : null, ye = yp.length ? yp[yp.length - 1].faiz : null;
  const ybp = ok(yb) && ok(ye) ? Math.round((ye - yb) * 100) : null, today = new Date().toISOString().slice(0, 10);
  const cal = `<article class="card ppk ppcal" id="ppCal"><div class="ppcalh"><h3>PPK Takvimi</h3><select class="ppsel" id="ppYear" aria-label="Yıl">${years.map(y => `<option value="${y}"${y === Y ? " selected" : ""}>${y}</option>`).join("")}</select></div>
    <p class="ppsum">${yp.length ? `${yp.length} karar · yıl içinde ${ybp === 0 ? "değişiklik yok" : `${ybp < 0 ? "−" : "+"}${Math.abs(ybp)}bp`} (%${nf(2).format(yb)} → %${nf(2).format(ye)})` : "Bu yıl için henüz karar yok."}</p>
    <ol class="ppcl" title="Politika faizi grafiğini aç/kapat">${ys.map(x => { const st = x.today ? "today" : x.tarih < today ? "past" : "future";
      return `<li class="${st}"><span class="dot"></span><span class="dd">${dLabel(x.tarih)}${x.ara ? " *" : ""}${x.today ? ' <span class="tag">BUGÜN</span>' : ""}</span><span class="kk">${x.karar ? `${x.karar} → %${nf(2).format(x.faiz)}` : st === "future" ? "—" : ""}</span></li>`; }).join("")}</ol>
    <button type="button" class="more" id="ppkToggle">${PPS.ppkChart ? "Grafiği gizle" : "Politika faizi trendini göster (son 2 yıl)"}</button></article>`;
  return `<div class="ppkgrid">${table}${cal}</div>${PPS.ppkChart ? `<article class="card"><h3>Politika Faizi (1 Hafta Repo) — Son 2 Yıl</h3><div id="ppkChart"></div></article>` : ""}`;
}
function ppkDrawChart(m) {
  const el = $("#ppkChart"); if (!el) return;
  const end = new Date(), st = new Date(end); st.setFullYear(end.getFullYear() - 2);
  const s0 = st.toISOString().slice(0, 10), e0 = end.toISOString().slice(0, 10);
  const pts = []; let cur = m.rateAt(s0); pts.push([s0, cur, toTime(s0)]);
  for (const f of m.F) if (f.tarih > s0 && f.tarih <= e0) { const prev = new Date(f.tarih + "T00:00:00"); prev.setDate(prev.getDate() - 1); const pd = prev.toISOString().slice(0, 10); pts.push([pd, cur, toTime(pd)]); cur = f.oran; pts.push([f.tarih, cur, toTime(f.tarih)]); }
  pts.push([e0, cur, toTime(e0)]);
  lineChart(el, { series: [{ name: "Politika faizi (%)", color: PAL()[0], data: pts }], height: 280, yFmt: v => nf(2).format(v) });
}
function ppStep(pts) { const o = []; for (let k = 0; k < pts.length; k++) { if (k && ok(pts[k][1]) && ok(o[o.length - 1]?.[1]) && pts[k][1] !== o[o.length - 1][1]) o.push([pts[k][0], o[o.length - 1][1], pts[k][2] - 1]); o.push(pts[k]); } return o; }
function ppDefaultCharts(m) {
  const ids = ppClipIdx(m, PPS.drange), M = m.M, pal = PAL(), col = c => pal[(c - 1) % pal.length];
  const a = $("#ppAof"), n = $("#ppNet"); if (!a || !n) return;
  lineChart(a, { series: [
    { name: "TCMB AOF (%)", color: col(4), data: ppStep(ids.map(i => [m.dt[i], ok(M.aof[i]) ? M.aof[i] : null, toTime(m.dt[i])])) },
    { name: "Politika faizi (%)", color: col(1), dash: true, data: ppStep(ids.map(i => [m.dt[i], M.pol[i], toTime(m.dt[i])])) }], height: 240, yFmt: v => nf(1).format(v) });
  ppStackChart(n, { dates: ids.map(i => m.dt[i]), height: 240,
    stacks: [["fon", "Para piyasaları ile fonlama", 1], ["swap", "Swap fonlaması", 2], ["st_neg", "Sterilizasyon", 8]].map(([k, nm, c]) => ({ name: nm, color: col(c), vals: ids.map(i => ok(M[k][i]) ? M[k][i] / 1e3 : null) })),
    line: { name: "Swap dahil net fonlama", color: "var(--ink)", vals: ids.map(i => ok(M.nets[i]) ? M.nets[i] / 1e3 : null) } });
}
function ppRender() {
  const pane = $("#ppPane"); pane.classList.remove("hidden");
  $("#tBanks").closest(".bar").classList.add("hidden"); $(".tlayout").classList.add("hidden");
  const m = ppModel();
  if (!m) { pane.innerHTML = '<div class="card empty">Para politikası verisi henüz yok. Bir sonraki güncellemede gelecek.</div>'; return; }
  const sel = PPS.sel;
  pane.innerHTML = ppBoxes(m)
    + (sel ? `<article class="card ppchart"><div class="ppch"><h3>${esc((PP_PARTS[sel] || { title: "TCMB AOF ve Politika Faizi" }).title)} ${sel === "aof" ? "(%) — Günlük" : "(₺ mr) — Günlük"}</h3><div class="chips" id="ppRange"></div></div>
      <div class="pptiles">${ppPartTiles(m, sel)}</div><div id="ppChart"></div>
      <p class="ppnote">${dLabel(m.dt[m.last])} itibarıyla. ${sel === "swap" ? "Swap stokları (milyon USD) × TCMB USD/TRY alış kuru; alım yönlü − satım yönlü. Pozitif: TCMB swapla TL verdi, negatif: TL çekti." : sel === "aof" ? "Politika faizi: TCMB 1 hafta repo ihale faizi." : "Kaynak: TCMB EVDS, Açık Piyasa İşlemleri ile Fonlama ve Sterilizasyon."}</p></article>`
      : `<p class="ppnote">Kırılımı görmek için bir kutuya tıklayın.</p>`)
    + `<div class="ppdef"><div class="ppdefh"><span class="lbl">Dönem</span><div class="chips" id="ppDRange"></div></div><div class="ppkgrid2"><article class="card"><h3>TCMB AOF (%) — Günlük</h3><div id="ppAof"></div><p class="ppnote">Ağırlıklı ortalama fonlama maliyeti · kesikli: politika faizi</p></article>
      <article class="card"><h3>Net Fonlama (₺ mr) — Günlük</h3><div id="ppNet"></div><p class="ppnote">Para piyasaları ile fonlama + swap fonlaması − sterilizasyon</p></article></div></div>`
    + ppkSection(m);
  if (sel) { rangeChips($("#ppRange"), PPS.range, k => { PPS.range = k; ppDrawChart(m); }); ppDrawChart(m); }
  rangeChips($("#ppDRange"), PPS.drange, k => { PPS.drange = k; ppDefaultCharts(m); }); ppDefaultCharts(m);
  ppkDrawChart(m);
}
function ppHide() { const pane = $("#ppPane"); if (pane) pane.classList.add("hidden"); $("#tBanks").closest(".bar").classList.remove("hidden"); $(".tlayout").classList.remove("hidden"); }
function bindPp() {
  $("#ppPane").addEventListener("change", e => { if (e.target.id === "ppYear") { PPS.ppkYear = +e.target.value; ppRender(); } });
  $("#ppPane").addEventListener("click", e => {
    const b = e.target.closest("[data-pp]"); if (b) { PPS.sel = PPS.sel === b.dataset.pp ? null : b.dataset.pp; ppRender(); return; }
    if (e.target.closest("#ppkToggle") || e.target.closest(".ppcl")) { PPS.ppkChart = !PPS.ppkChart; ppRender(); if (PPS.ppkChart) $("#ppkChart")?.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
  });
}

function bindTcmb() {
  bindPp();
  $("#tSub").onclick = e => { const b = e.target.closest("button"); if (!b) return; S.tSub = b.dataset.p; const ks = tBanks().map(x => x.key); if (!ks.includes(S.tBank)) S.tBank = ks.includes(store.get("bv.tbank")) ? store.get("bv.tbank") : (ks.includes("katilim") ? "katilim" : ks[0]); renderTcmb(); };
  $("#tNav").addEventListener("change", e => {
    const b = e.target.closest("input[data-t]"); if (!b) return; const id = b.dataset.t, cur = S.tTopics[S.tSub] || [];
    S.tTopics[S.tSub] = cur.includes(id) ? cur.filter(x => x !== id) : cur.concat(id); renderTcmb();
  });
  $("#tNav").addEventListener("toggle", e => { const d = e.target.closest && e.target.closest("details[data-sec]"); if (!d) return; const k = S.tSub + "|" + d.dataset.sec; d.open ? S.tClosed.delete(k) : S.tClosed.add(k); }, true);
  $("#tBanks").onclick = e => { const b = e.target.closest("button[data-b]"); if (!b) return; S.tBank = b.dataset.b; store.set("bv.tbank", S.tBank); renderTcmb(); };
  $("#tPanels").addEventListener("change", e => {
    const t = e.target, code = t.dataset.ta || t.dataset.tb; if (!code) return; const ab = S.tAB[code];
    if (t.dataset.ta) { ab.A = +t.value; if (ab.A >= ab.B) ab.B = Math.min(D.e.groups[code].dates.length - 1, ab.A + 1); } else { ab.B = +t.value; if (ab.A >= ab.B) ab.A = Math.max(0, ab.B - 1); }
    renderTcmb();
  });
  $("#tPanels").addEventListener("click", e => {
    const q = e.target.closest("button[data-q]"); if (q) { S.tAB[q.dataset.q].A = +q.dataset.i; renderTcmb(); return; }
    const rk = e.target.closest("button[data-rk]"); if (rk) { S.tRange = rk.dataset.rk; $$("#tPanels button[data-rk]").forEach(x => x.setAttribute("aria-pressed", x.dataset.rk === S.tRange)); $$("#tPanels article[data-g]").forEach(a => drawTChart(a.dataset.g)); return; }
    const cl = e.target.closest("button[data-clear]"); if (cl) { S.tSel[cl.dataset.clear] = []; renderTcmb(); return; }
    const tr = e.target.closest("tr.row[data-s]"); if (!tr) return;
    const code = tr.closest("article").dataset.g, c = tr.dataset.s, sel = S.tSel[code] || [];
    S.tSel[code] = sel.includes(c) ? sel.filter(x => x !== c) : sel.concat(c);
    renderTcmb();
  });
}

// =============================================================== akış
function renderPane() { if (D) ({ bddk: renderBddk, tcmb: renderTcmb })[S.tab](); }
$("#tabs").onclick = e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return; S.tab = b.dataset.tab;
  $$("#tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  $$("[data-pane]").forEach(p => p.classList.toggle("hidden", p.dataset.pane !== S.tab));
  try { history.replaceState(null, "", "#" + S.tab); } catch {}
  renderPane();
};
let rz, lastW = innerWidth; addEventListener("resize", () => { if (Math.abs(innerWidth - lastW) < 40) return; lastW = innerWidth; clearTimeout(rz); rz = setTimeout(renderPane, 150); });

function start(raw) {
  D = { w: modelWeekly(raw.bddk_haftalik), m: modelMonthly(raw.bddk_aylik), e: prepEvds(raw.evds), p: raw.politika || null };
  if (!D.w && D.m) S.bFreq = "m";
  if (S.bFreq === "m" && !D.m && D.w) S.bFreq = "w";
  if (!D.w && !D.m && D.e) S.tab = "tcmb";
  $("#gate").classList.add("hidden");
  bindBddk(); bindTcmb(); renderMeta();
  if (window.__BANKA_NOTE) $("#notice").innerHTML = `<div class="pill notice">${window.__BANKA_NOTE}</div>`;
  const h = location.hash.slice(1);
  ((h && $(`#tabs button[data-tab="${h}"]`)) || $(`#tabs button[data-tab="${S.tab}"]`)).click();
}
const th = store.get("bv.theme"); if (th) document.documentElement.dataset.theme = th;

async function unlock() {
  try {
    const raw = await loadAll();
    if (!raw.bddk_haftalik && !raw.bddk_aylik && !raw.evds) throw new Error("nodata");
    start(raw);
  } catch (e) { $("#gateErr").textContent = "Veriler yüklenemedi."; }
}
if (window.__BANKA_GZ) {
  gunzip(b64(window.__BANKA_GZ)).then(start).catch(e => { $("#gateErr").textContent = "Önizleme verisi açılamadı: " + e.message; });
} else unlock();
})();
</script>
