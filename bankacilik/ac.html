<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ALCO - Bankacılık Verileri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1a1d26;--mut:#85837d;--line:#e2e4ea;--acc:#2563eb;--neg:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#0f131c;--card:#181d29;--fg:#e7ebf4;--mut:#93a0b8;--line:#2a3142;--acc:#6f9bff;--neg:#ff7b72;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--fg);font:14px "DM Sans",system-ui,sans-serif}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:12px;width:min(360px,100%)}
h1{margin:0;font:800 20px Archivo,"DM Sans",sans-serif;letter-spacing:.04em}
p{margin:0;color:var(--mut);font-size:13px}
input[type=password]{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;background:var(--card);color:var(--fg)}
label{font-size:13px;display:flex;gap:8px;align-items:center}
button{border:0;border-radius:8px;padding:10px 12px;font:inherit;font-weight:600;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.7;cursor:progress}
#lerr{color:var(--neg);font-size:13px;min-height:1em}
</style>
</head>
<body>
<form id="lf">
<h1>BANKACILIK VERİLERİ</h1>
<p>Bu sayfa şifreyle korunuyor. Fon Detay ile aynı şifre.</p>
<input type="password" id="pw" placeholder="Şifre" autocomplete="current-password" aria-label="Şifre" required>
<label><input type="checkbox" id="rem"> Bu cihazda hatırla</label>
<button id="lb" type="submit">Giriş</button>
<div id="lerr" role="alert"></div>
</form>
<script>
(function(){
const $=id=>document.getElementById(id);let raw=null;
const load=()=>raw?Promise.resolve(raw):fetch('sayfa.enc?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('veri');return r.arrayBuffer()}).then(b=>raw=new Uint8Array(b));
async function open(pw){const b=await load();if(String.fromCharCode(b[0],b[1],b[2])!='FD1')throw new Error('veri');
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b.slice(3,19),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 let plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(19,31)},key,b.slice(31))}catch(e){throw new Error('sifre')}
 return await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
async function go(pw,auto){$('lb').disabled=true;$('lerr').textContent='';$('lb').textContent='Açılıyor…';
 try{const html=await open(pw);if($('rem').checked||auto){try{localStorage.setItem('fd-pw',pw)}catch(e){}}
  document.open();document.write(html);document.close()}
 catch(e){if(auto){try{localStorage.removeItem('fd-pw')}catch(x){}}$('lerr').textContent=e.message=='sifre'?'Şifre yanlış.':e.message=='veri'?'Veri dosyası okunamadı. Sayfa henüz güncellenmemiş olabilir.':'Sayfa açılamadı: '+e.message;$('lb').disabled=false;$('lb').textContent='Giriş'}}
$('lf').addEventListener('submit',e=>{e.preventDefault();go($('pw').value,false)});
let s=null;try{s=localStorage.getItem('fd-pw')}catch(e){}if(s){$('rem').checked=true;go(s,true)}
})();
</script>
</body>
</html>
