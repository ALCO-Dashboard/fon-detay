<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOST KATILIM · Piyasa Verileri (ALCO)</title>
<script>try{var t=localStorage.getItem("alco-theme")||localStorage.getItem("fd-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--k-bg:#f5f3f3;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--k-bg:#141011;color-scheme:dark}}
:root[data-theme="dark"]{--k-bg:#141011;color-scheme:dark}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--k-bg)}
#alcoFrames{flex:1;min-height:0;position:relative}
#alcoFrames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--k-bg)}
#alcoFrames iframe[hidden]{display:none}
</style>
</head>
<body>
<div id="alcoTop"></div>
<div id="alcoFrames"></div>
<script src="ortak/ust.js" data-page="" data-root="./" data-shell="1"></script>
</body>
</html>
