<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Fon Detay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Düzen: başlık → tarih + görünüm → filtreler → özet kutuları → (TL: trend, dağılım, günlük değişim, haftalık akım | Kendi para cinsi: birim şeridi + birim kartları) → sütun filtreli tablo */
:root{--bg:#f3f5f9;--card:#fff;--fg:#141a2a;--mut:#667089;--line:#dde2ec;--acc:#c8102e;--accbg:#fdecee;--pos:#0b8a5f;--neg:#c8322b;--warn:#b8650a;--hd:#eef1f6;--own:#b45309;
--sans:"DM Sans",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f131c;--card:#181d29;--fg:#e7ebf4;--mut:#93a0b8;--line:#2a3142;--acc:#f0525f;--accbg:#3a171b;--pos:#3fcf9a;--neg:#ff7b72;--warn:#f0a84a;--hd:#1e2432;--own:#e08a3c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f131c;--card:#181d29;--fg:#e7ebf4;--mut:#93a0b8;--line:#2a3142;--acc:#f0525f;--accbg:#3a171b;--pos:#3fcf9a;--neg:#ff7b72;--warn:#f0a84a;--hd:#1e2432;--own:#e08a3c;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:Archivo,'DM Sans',system-ui,sans-serif;font-size:26px;margin:0;font-weight:800;letter-spacing:.03em;line-height:1.15;text-wrap:balance}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--fg);padding-bottom:10px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tabs button{font:inherit;font-family:Archivo,'DM Sans',sans-serif;font-weight:700;font-size:14.5px;letter-spacing:.02em;text-transform:uppercase;text-align:center;padding:13px 10px;border:1px solid var(--line);border-bottom:3px solid var(--line);border-radius:10px;background:var(--card);color:var(--mut);cursor:pointer}.tabs button[aria-pressed=true]{color:var(--acc);border-color:var(--acc);background:var(--accbg)}
@media (max-width:700px){.tabs{grid-template-columns:minmax(0,1fr)}}
.fill{display:flex;flex-direction:column}.fill .ch{flex:1 1 auto;height:auto;min-height:320px}.fill .ch canvas{position:absolute;inset:0}
.fi{flex:none;display:inline-flex;align-items:center;justify-content:center;width:20px;height:22px;padding:0;border:0;border-radius:5px;background:none;color:var(--mut);cursor:pointer;font-size:11px}.fi.set{background:var(--acc);color:#fff}
.fc{display:flex;gap:2px;align-items:center}
.sitenav{display:flex;flex-wrap:wrap;align-items:center;gap:4px;background:var(--fg);border-radius:10px;padding:5px 8px}.sitenav span{color:var(--bg);font-weight:700;letter-spacing:.08em;font-size:12px;margin:0 12px 0 4px;opacity:.85}.sitenav a{color:var(--bg);opacity:.75;text-decoration:none;font-size:13px;font-weight:600;padding:5px 10px;border-radius:6px}.sitenav a:hover{opacity:1}.sitenav a[aria-current=page]{opacity:1;background:color-mix(in srgb,var(--bg) 18%,transparent)}
h2{font-size:14px;margin:0 0 10px;font-weight:600}
.sub{color:var(--mut);font-size:13px;margin-top:4px}.sub b{color:var(--fg)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
select,input,button.b{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
button.b{cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-weight:600;border:0;background:var(--card);color:var(--mut);padding:7px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
#m-own[aria-pressed=true]{background:var(--own)}
.right{margin-left:auto}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.fx{font-family:var(--mono);font-size:12px;color:var(--mut)}.fx b{color:var(--fg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--kc,var(--acc));border-radius:12px;padding:12px 14px}
.kpi .v{font-family:var(--mono);font-weight:700;font-size:22px;margin:6px 0 2px}
.kpi .n{color:var(--mut);font-size:12px}
.g2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.g11{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.g2,.g11,.g3{grid-template-columns:minmax(0,1fr)}}
.ch{position:relative;height:320px}.ch.s{height:230px}.dn{position:relative;height:190px}
.cl{display:flex;flex-direction:column;gap:5px;margin-top:12px;font-size:12.5px}
.cl div{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center}
.cl .c{color:var(--mut);font-size:11px}.cl .a{font-family:var(--mono);font-weight:600}
.pdl{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.pdl div{border-left:3px solid var(--acc);padding:2px 0 2px 10px;min-width:0}.pdl .p{display:block;font-family:var(--mono);font-weight:700;font-size:17px}.pdl .n{display:block;font-size:11.5px;color:var(--mut);line-height:1.3}.pdl .o{border-left-color:var(--line)}
.qk{display:inline-flex;gap:4px;flex-wrap:wrap}.qk button{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 10px;cursor:pointer}.qk button.on{background:var(--accbg);color:var(--acc);border-color:var(--acc)}.qk button:disabled{opacity:.4;cursor:default}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c)}
.strip{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--mut);background:var(--bg)}
.pill b{font-family:var(--mono);color:var(--fg)}
.uc .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.uc .nm{font-weight:700;display:flex;align-items:center;gap:6px}.uc .nm small{color:var(--mut);font-weight:400}
.uc .tv{font-family:var(--mono);font-weight:700;font-size:19px;margin-top:2px}
.uc .gr{text-align:right;font-family:var(--mono);font-weight:700}.uc .gr small{display:block;font-family:var(--sans);font-weight:400;color:var(--mut);font-size:11px}
.uc .c1{position:relative;height:130px;margin-top:6px}.uc .c2{position:relative;height:80px}
.uc .fl{display:flex;justify-content:space-between;margin-top:8px;font-size:11px}.uc .fl b{font-family:var(--mono);font-size:12.5px}
.uc .wr{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--mut)}.uc .wr b{font-family:var(--mono);color:var(--fg);font-size:13px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:11.5px;font-variant-numeric:tabular-nums}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
#hd th{white-space:normal;vertical-align:bottom;line-height:1.25}
th{background:var(--hd);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);cursor:pointer;user-select:none}
th.on{color:var(--acc)}
tr.fr th{padding:3px 4px;cursor:default;text-transform:none;letter-spacing:0}
tr.fr input{flex:1 1 0;width:0;min-width:26px;padding:3px 4px;font-size:11px;border-radius:6px;font-family:var(--mono)}
tr.fr input.set{border-color:var(--acc);background:var(--accbg)}
th.g,td.g{border-left:1px solid var(--line)}
td.l,th.l{text-align:left}
td.num{font-family:var(--mono)}
td.code{font-family:var(--mono);font-weight:700;color:var(--acc);text-align:left}
td.name{text-align:left;white-space:normal;min-width:150px;max-width:230px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 6px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:11.5px}
.risk{display:inline-block;width:22px;border-radius:5px;text-align:center;font-family:var(--mono);font-weight:700;background:var(--hd)}
.r5,.r6,.r7{color:var(--neg)}.r3,.r4{color:var(--warn)}.r1,.r2{color:var(--pos)}
.pg button:disabled{opacity:.4;cursor:default}
.tot{font-size:12.5px;color:var(--mut);display:flex;flex-direction:column;gap:8px}.tl{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}.tl .lbl{min-width:84px}.tp{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 12px;background:var(--bg)}
details.note summary{cursor:pointer;font-weight:600;color:var(--acc);list-style-position:inside}details.note p{margin:8px 0 0}
.xtot{font-size:12.5px;color:var(--mut)}.tot b{font-family:var(--mono);color:var(--fg)}
.note{color:var(--mut);font-size:12px;line-height:1.55;max-width:95ch}

[hidden]{display:none!important}*{box-sizing:border-box}html{color-scheme:light}body{margin:0}img{max-width:100%}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#lock form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 24px;display:flex;flex-direction:column;gap:12px}
#lock h1{font-size:20px}#lock p{margin:0;color:var(--mut);font-size:13px}
#lock input[type=password]{width:100%;padding:11px 12px;font-size:15px}
#lock button{font:inherit;font-weight:700;padding:11px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
#lock button:disabled{opacity:.6;cursor:default}#lock label{font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:center}
#lerr{color:var(--neg);font-size:13px;min-height:18px}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
function startApp(DATA){

const DATES=DATA.dates,FXD=DATA.fx,DSETS=DATA.sets;let META,V,P,KS,PD,CC,NF,FL,TAB="YAT";
// META: 0 kod,1 ad,2 kategori,3 birim,4 PYŞ,5 katılım,6 özel,7 tefas,8 risk,9 ücret · V: bin TL fon değeri · P: pay fiyatı (TL) · FXD: [USD,EUR,GBP,altın gr,gümüş gr] TL
const $=id=>document.getElementById(id);

const UC={USD:'#059669',EUR:'#2563eb',TL:'#4f46e5',XAG:'#64748b',GBP:'#7c3aed',XAU:'#b45309'},UN={TL:'TL',USD:'Dolar',EUR:'Euro',GBP:'Pound',XAU:'Altın',XAG:'Gümüş'},UO=['USD','EUR','TL','XAG','GBP','XAU'];
const FXI={USD:0,EUR:1,GBP:2,XAU:3,XAG:4},N=DATES.length,YB=Math.max(0,DATES.indexOf('2025-12-31'));
let cmp=false,own=false,i1=N-1,i0=YB,sortK='v1',dir=-1,page=0,colF={},LCUR=[];const PS=25;const FUN='<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M1 2h14l-5.5 6.5V14l-3-1.5V8.5z" fill="currentColor"/></svg>';const sp=v=>v==null?'—':(v>0?'+':v<0?'-':'')+'%'+nf(Math.abs(v),1);
const snap=s=>{let k=-1;for(let i=0;i<N;i++)if(DATES[i]<=s)k=i;return k<0?0:k};const snapU=s=>Math.max(YB,snap(s));
const back1m=i=>{const d=new Date(DATES[i]+'T00:00:00Z');d.setUTCMonth(d.getUTCMonth()-1);const s=d.toISOString().slice(0,10);return s<DATES[0]?-1:snap(s)};
const days=(a,b)=>(Date.parse(DATES[b])-Date.parse(DATES[a]))/864e5;
const fx=(c,i)=>c=='TL'?1:FXD[i][FXI[c]];
const U=f=>META[f][3];
const aum=(f,i,o)=>V[f][i]?V[f][i]*1000/(o?fx(U(f),i):1):null;
const pay=(f,i)=>V[f][i]&&P[f][i]?V[f][i]*1000/P[f][i]:null;
const ret=(f,a,b,o)=>{if(a<0||!P[f][a]||!P[f][b])return null;let r=P[f][b]/P[f][a];if(o){const c=U(f);if(FXI[c]<3)r/=fx(c,b)/fx(c,a)}return (r-1)*100};
const ann=(r,a,b)=>r==null||a<0||b<=a?null:r*365/days(a,b);
const tr=d=>d.split('-').reverse().join('.');
// günlük net para akımı (TL): değer değişiminden fiyat etkisi çıkarılır
const mkFL=()=>META.map((_,f)=>{const a=new Float64Array(N),v=V[f],p=P[f];for(let t=1;t<N;t++){const v0=v[t-1],v1=v[t];if(!v1)continue;if(!v0){a[t]=v1*1000;continue}const r=p[t]/p[t-1];if(r>1/3&&r<3)a[t]=(v1-v0*r)*1000}return a});
const flow=(f,a,b,o)=>{let s=0;const c=U(f),x=FL[f];for(let t=a+1;t<=b;t++)if(x[t])s+=x[t]/(o?fx(c,t):1);return s};
const nf=(x,d)=>x.toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d});
const big=v=>{if(v==null)return'—';const a=Math.abs(v);return a>=1e12?nf(v/1e12,2)+' Tr':a>=1e9?nf(v/1e9,1)+' Mlr':a>=1e6?nf(v/1e6,1)+' Mn':a>=1e3?nf(v/1e3,1)+' B':nf(v,0)};
const fU=(v,c)=>v==null?'—':c=='XAU'||c=='XAG'?(Math.abs(v)>=1e6?nf(v/1e6,2)+' ton':nf(v/1e3,1)+' kg'):c=='TL'?big(v)+' ₺':({USD:'$',EUR:'€',GBP:'£'})[c]+big(v);
const sgn=(s,v)=>(v>0?'+':'')+s;
const pct=(v,d=1)=>v==null?'—':`<span class="${v>0?'pos':v<0?'neg':''}">%${nf(v,d)}</span>`;
const cls=v=>v>0?'pos':v<0?'neg':'';
const m1=()=>back1m(i1),pa=()=>cmp?i0:Math.max(m1(),0);
const G={kod:f=>META[f][0],ad:f=>META[f][1],kat:f=>META[f][2],cur:f=>UN[U(f)],
 v0:f=>aum(f,i0,own),v1:f=>aum(f,i1,own),vd:f=>{const a=aum(f,i0,own),b=aum(f,i1,own);return a&&b?(b/a-1)*100:null},
 p0:f=>pay(f,i0),p1:f=>pay(f,i1),pd:f=>{const a=pay(f,i0),b=pay(f,i1);return a&&b?(b/a-1)*100:null},
 px:f=>P[f][i1]?P[f][i1]/(own?fx(U(f),i1):1):null,
 gp:f=>ret(f,i0,i1,own),gpa:f=>ann(ret(f,i0,i1,own),i0,i1),g1:f=>ret(f,m1(),i1,own),g1a:f=>ann(ret(f,m1(),i1,own),m1(),i1),gy:f=>i1>YB?ann(ret(f,YB,i1,own),YB,i1):null,
 ak:f=>V[f][i1]?flow(f,pa(),i1,own):null,yat:f=>KS[f][i1]||null,fee:f=>META[f][9],risk:f=>META[f][8]};

async function open(pw){const b=await load();if(String.fromCharCode(b[0],b[1],b[2])!='FD1')throw new Error('veri');

 let plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(19,31)},key,b.slice(31))}catch(e){throw new Error('sifre')}
 const txt=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();return JSON.parse(txt)}
