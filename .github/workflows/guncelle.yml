name: Fon Detay güncelle

on:
  schedule:
    - cron: "30 8 * * 1-5"    # hafta içi 11:30 (Türkiye saati)
    - cron: "0 14 * * 1-5"    # hafta içi 17:00 (Türkiye saati)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fon-detay-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Gerekli paketleri kur
        run: pip install requests cryptography

      - name: Önceki veriyi al
        run: |
          mkdir -p site
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth=1 origin gh-pages
            git show FETCH_HEAD:store.enc > site/store.enc || rm -f site/store.enc
          fi

      - name: Veriyi güncelle
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python guncelle.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Katılım bültenini derle
        continue-on-error: true
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          npm install --no-save --no-audit --no-fund xlsx@0.18.5
          node katilim/derle.mjs site

      - name: Sayfayı yayınla
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "fon-detay-bot"
          git config user.email "fon-detay-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Veri güncellendi"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
