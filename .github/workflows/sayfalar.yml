name: Katılım ve bankacılık sayfalarını güncelle

# katilim/ ya da bankacilik/ klasöründe değişiklik olunca yalnızca bu iki sayfayı yeniler (TEFAS verisini beklemez).
on:
  push:
    branches: [main]
    paths:
      - "katilim/**"
      - "bankacilik/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fon-detay-guncelle
  cancel-in-progress: false

jobs:
  katilim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Yayındaki siteyi al
        run: git clone --depth 1 -b gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site

      - name: Katılım bültenini derle
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          npm install --no-save --no-audit --no-fund xlsx@0.18.5
          node katilim/derle.mjs site
          node bankacilik/derle.mjs site

      - name: Sayfayı yayınla
        run: |
          cd site
          git config user.name "fon-detay-bot"
          git config user.email "fon-detay-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Değişiklik yok"; exit 0; }
          git commit -q -m "Katılım / bankacılık sayfaları güncellendi"
          git push origin gh-pages
